# PEP 1, as adopted by EEP 1, has an editor "ensure all CI build and lint
# checks pass without errors" before merging an EEP.
#
# This workflow triggers on every push and pull request against
# github.com/soilmass/eeps. No job has started yet. GitHub refuses each
# one with "The job was not started because recent account payments have
# failed or your spending limit needs to be increased." The checks run
# locally and pass, so the lint half of the substitution is filled; the
# half this file is meant to fill has never executed. EEP 1 records that
# as an open issue.
name: checks

on:
  push:
  pull_request:

jobs:
  check-eeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The checker needs no dependency to run. PyYAML lets it also prove
      # the front matter is valid YAML, which is what EEP 3's pin of
      # Jekyll's front-matter format requires, so CI installs it.
      - run: pip install pyyaml pylint

      # tools/floor holds EEP 7's floor as checks; repo-review runs
      # them. Installing it is what lets tools/check-floor decide
      # anything, and it pulls repo-review with its cli extra, without
      # which repo-review's own entry point cannot start.
      - run: pip install -e tools/floor

      # Every rule is seen failing on its own fixture before any rule is
      # trusted to pass.
      - run: tests/run-fixtures

      # Every floor rule seen failing on a repository built to provoke
      # it, before any of them is trusted to pass.
      - run: tests/run-floor-fixtures

      - run: tools/check-eeps

      # EEP 7's floor, decided against this repository. The same command
      # takes a path and decides any other.
      - run: tools/check-floor

      # EEP 6's standard. The tool skips when pylint is absent,
      # so CI is the only place conformance is actually proven.
      - run: tools/check-python

      # Checks EEP 1's substitution table against the pinned PEP 1. It
      # fetches the text and keeps no copy, so it needs a network and
      # passes offline. CI is where it actually decides anything.
      - run: tools/check-adoption

      # The standard is generated and committed, so it can go stale. This
      # refuses a tree whose standard/ is not what the EEPs produce.
      - run: tools/build-standard --check
